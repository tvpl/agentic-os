<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mordomo-token" content="" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b82f6'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EM%3C/text%3E%3C/svg%3E" />
    <title>MordomoOS</title>
    <meta name="color-scheme" content="dark light" />
    <script>
      // First paint without a flash: restore the theme preset chosen on this browser
      // before the app loads (theme.ts keeps the same key in sync).
      try {
        var p = localStorage.getItem("mordomo.themePreset");
        if (p && /^[a-z-]+$/.test(p)) document.documentElement.dataset.preset = p;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
