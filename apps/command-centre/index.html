<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mordomo-token" content="" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b82f6'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EM%3C/text%3E%3C/svg%3E"
    />
    <title>MordomoOS</title>
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0a08" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mordomo" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root">
      <div
        id="boot-status"
        role="status"
        style="
          min-height: 100dvh;
          display: grid;
          place-content: center;
          gap: 16px;
          padding: 32px;
          box-sizing: border-box;
          background: #0b0a08;
          color: #f2eee3;
          font: 15px/1.6 system-ui;
          text-align: center;
        "
      >
        <strong style="font-size: 24px">MordomoOS</strong>
        <span id="boot-message">Starting your workspace…</span>
        <button
          id="boot-reload"
          type="button"
          hidden
          style="
            padding: 12px 20px;
            border: 1px solid #f97316;
            border-radius: 10px;
            background: #f97316;
            color: #0b0a08;
            cursor: pointer;
            font: inherit;
          "
        >
          Reload
        </button>
      </div>
    </div>
    <div id="modal-root"></div>
    <script src="/boot-recovery.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
