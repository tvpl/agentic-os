[package]
name = "mordomo-desktop"
description = "MordomoOS desktop app (Tauri 2 shell around the bundled local service)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "mordomo_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "mordomo-desktop"
path = "src/main.rs"

[features]
# Compiled in only by a build that has the updater's public key (docs/release.md).
updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mordomo-shell-core = { path = "../shell-core" }
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "dynamic-acl"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = { version = "2", default-features = false }
tauri-plugin-updater = { version = "2", optional = true, default-features = false, features = ["rustls-tls", "zip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
