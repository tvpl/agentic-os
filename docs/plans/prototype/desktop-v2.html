<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MordomoOS · Desktop v2 (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --accent:#f97316;
  --accent-contrast:#0c0a07;
  --accent-soft:color-mix(in srgb, var(--accent) 18%, transparent);
  --accent-line:color-mix(in srgb, var(--accent) 55%, transparent);
  --accent-glow:color-mix(in srgb, var(--accent) 70%, transparent);
  --bg:#0b0a08; --bg-raise:#131109; --bg-raise-2:#1b1810;
  --border:#2b2617; --border-strong:#403a26;
  --text:#f2eee3; --text-dim:#b3aa96; --text-faint:#8f8672;
  --ok:#4ade80; --warn:#fbbf24; --danger:#f87171; --info:#7dd3fc;
  --grid-dot:rgba(236,231,221,.045);
  --font-display:"Rajdhani","SF Pro Display",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-1:3px; --r-2:5px; --r-3:8px; --r-4:12px; --r-pill:999px;
  --dur-fast:120ms; --dur-base:200ms; --dur-slow:320ms; --dur-enter:480ms;
  --ease-standard:cubic-bezier(.2,0,0,1);
  --ease-emphasized:cubic-bezier(.2,.8,.2,1);
  --ease-spring:cubic-bezier(.34,1.4,.64,1);
  --strip-h:34px; --dock-h:52px; --rail-w:10px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-mono); font-size:13px;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hud{font-family:var(--font-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase}

/* ── plano de fundo: sem esfera. grade + horizonte + presença do agente ── */
#field{position:fixed;inset:0;z-index:0;pointer-events:none}
#field .dots{
  position:absolute;inset:0;
  background-image:radial-gradient(circle at 1px 1px,var(--grid-dot) 1px,transparent 0);
  background-size:26px 26px;
  mask-image:radial-gradient(ellipse 120% 90% at 50% 45%,#000 35%,transparent 100%);
}
#field .drift{
  position:absolute;width:60vw;height:60vw;border-radius:50%;filter:blur(90px);opacity:.30;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 26%,transparent),transparent 62%);
  animation:drift 46s ease-in-out infinite alternate;
}
#field .drift.b{
  left:auto;right:-12vw;bottom:-16vw;animation-duration:62s;opacity:.16;
  background:radial-gradient(circle,rgba(125,211,252,.30),transparent 62%);
}
#field .drift.a{left:-14vw;top:-18vw}
@keyframes drift{to{transform:translate3d(9vw,7vh,0) scale(1.15)}}
#field .horizon{
  position:absolute;left:0;right:0;bottom:calc(var(--dock-h) + 96px);height:1px;
  background:linear-gradient(90deg,transparent,var(--border-strong) 22%,var(--accent-line) 50%,var(--border-strong) 78%,transparent);
  opacity:.5;
}
/* presença do agente: respiro atrás do console. substitui o icosfério. */
#presence{
  position:fixed;left:50%;bottom:calc(var(--dock-h) + 4px);width:820px;max-width:86vw;height:270px;
  transform:translateX(-50%);z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 50% 60% at 50% 100%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%);
  opacity:.5;transition:opacity var(--dur-slow) var(--ease-standard);
}
body[data-core="thinking"] #presence{animation:breathe 2.1s ease-in-out infinite;opacity:.95}
@keyframes breathe{0%,100%{opacity:.45;transform:translateX(-50%) scaleY(.94)}50%{opacity:1;transform:translateX(-50%) scaleY(1.06)}}

/* ─────────────── faixa ambiente (topo) ─────────────── */
#strip{
  position:fixed;top:0;left:0;right:0;height:var(--strip-h);z-index:40;
  display:flex;align-items:center;gap:20px;padding:0 14px 0 18px;
  background:linear-gradient(180deg,rgba(11,10,8,.94),rgba(11,10,8,.55));
  border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent);
  backdrop-filter:blur(12px);
  font-size:11px;
}
#strip .brand{font-family:var(--font-display);font-weight:700;letter-spacing:.14em;font-size:12px;text-transform:uppercase;color:var(--text-dim)}
#strip .brand b{color:var(--accent)}
#strip .spacer{flex:1}
.sig{
  display:flex;align-items:center;gap:7px;height:22px;padding:0 9px;border-radius:var(--r-pill);
  color:var(--text-faint);border:1px solid transparent;
  transition:color var(--dur-fast),border-color var(--dur-fast),background var(--dur-fast);
  white-space:nowrap;
}
.sig:hover{color:var(--text-dim);border-color:var(--border)}
.sig .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55;flex:none}
.sig .v{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.sig .k{font-family:var(--font-display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.72}
/* a regra central: ocioso não acende. */
.sig[data-level="idle"]{opacity:.62}
.sig[data-level="info"]{color:var(--text-dim)}
.sig[data-level="warn"]{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 26%,transparent);background:rgba(251,191,36,.07)}
.sig[data-level="critical"]{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 34%,transparent);background:rgba(248,113,113,.09)}
.sig[data-level="critical"] .dot,.sig[data-level="warn"] .dot{opacity:1;animation:pip 1.9s ease-in-out infinite}
@keyframes pip{50%{opacity:.25}}
.sig[data-surface="1"]{cursor:pointer}
.sig[data-surface="0"]{cursor:default}
/* relógio: sinal sem superfície. clicar não promete tela que não existe. */
#sig-clock{font-variant-numeric:tabular-nums;letter-spacing:.06em;color:var(--text-dim);font-size:12px}
#sig-clock.nudge{animation:nudge var(--dur-base) var(--ease-spring)}
@keyframes nudge{50%{transform:scale(1.09);color:var(--text)}}

/* ─────────────── trilho de apps (esquerda) ─────────────── */
#rail{
  position:fixed;left:0;top:var(--strip-h);bottom:var(--dock-h);z-index:38;
  width:var(--rail-w);display:flex;flex-direction:column;justify-content:center;
  transition:width var(--dur-slow) var(--ease-emphasized);
}
#rail .spine{
  position:absolute;left:0;top:8%;bottom:8%;width:3px;border-radius:2px;
  background:linear-gradient(180deg,transparent,var(--accent-line) 18%,var(--accent) 50%,var(--accent-line) 82%,transparent);
  opacity:.5;transition:opacity var(--dur-base),box-shadow var(--dur-base);
}
#rail:hover .spine,#rail.open .spine{opacity:1;box-shadow:0 0 18px var(--accent-glow)}
/* pips: conector pendente é visível com o trilho fechado. */
#rail .pips{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:7px;padding-left:1px}
#rail .pips i{width:5px;height:5px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px rgba(251,191,36,.6);animation:pip 2.4s ease-in-out infinite}
#rail.open .pips{opacity:0}
#rail .items{
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:212px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;
  opacity:0;pointer-events:none;
  background:linear-gradient(100deg,rgba(19,17,9,.96),rgba(19,17,9,.72));
  border:1px solid var(--border);border-left:0;border-radius:0 var(--r-4) var(--r-4) 0;
  backdrop-filter:blur(16px);box-shadow:26px 0 60px -30px rgba(0,0,0,.9);
  transition:opacity var(--dur-base) var(--ease-standard);
}
#rail.open .items{opacity:1;pointer-events:auto}
#rail.open{width:222px}
.rail-item{
  display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:var(--r-3);
  color:var(--text-dim);text-align:left;width:100%;
  transform:translateX(-14px);opacity:0;
  transition:background var(--dur-fast),color var(--dur-fast),transform var(--dur-base) var(--ease-emphasized);
}
#rail.open .rail-item{transform:none;opacity:1;transition-delay:var(--d,0ms)}
.rail-item .g{width:22px;flex:none;text-align:center;font-size:15px;filter:grayscale(.3)}
.rail-item .n{font-family:var(--font-display);font-weight:600;letter-spacing:.05em;font-size:14px;white-space:nowrap}
.rail-item .tail{margin-left:auto;font-size:10px;color:var(--warn);letter-spacing:.08em}
.rail-item:hover{background:var(--accent-soft);color:var(--text);transform:translateX(3px) scale(1.035)}
.rail-item.ghost{opacity:.55}
#rail.open .rail-item.ghost{opacity:.6}
.rail-sep{height:1px;background:var(--border);margin:7px 4px}

/* ─────────────── palco ─────────────── */
#stage{position:fixed;top:var(--strip-h);left:var(--rail-w);right:0;bottom:var(--dock-h);z-index:10;overflow:hidden}
.win.dragging,.win.dragging *{user-select:none!important}
#stage.overview{background:rgba(11,10,8,.34);transition:background var(--dur-slow)}

/* ─────────────── janela ─────────────── */
.win{
  position:absolute;display:flex;flex-direction:column;overflow:hidden;
  border:1px solid var(--border);border-radius:var(--r-4);
  background:linear-gradient(180deg,rgba(19,17,9,.90),rgba(11,10,8,.86));
  backdrop-filter:blur(16px) saturate(1.08);
  box-shadow:0 24px 60px -28px rgba(0,0,0,.92),0 2px 0 rgba(255,255,255,.02) inset;
  transition:border-color var(--dur-base),box-shadow var(--dur-base),opacity var(--dur-base),filter var(--dur-base);
  will-change:transform;
}
.win.unfocused{filter:saturate(.72) brightness(.9);opacity:.9}
.win.focused{
  border-color:color-mix(in srgb,var(--accent) 42%,var(--border));
  box-shadow:0 30px 76px -26px rgba(0,0,0,.95),0 0 0 1px color-mix(in srgb,var(--accent) 14%,transparent),
             0 0 42px -14px var(--accent-glow);
}
/* cantos em colchete só na janela em foco — moldura é sinal, não enfeite */
.win .bracket{position:absolute;width:12px;height:12px;opacity:0;transition:opacity var(--dur-base);pointer-events:none;border-color:var(--accent)}
.win.focused .bracket{opacity:.85}
.win .bracket.tl{top:5px;left:5px;border-top:1.5px solid;border-left:1.5px solid;border-radius:var(--r-1) 0 0 0}
.win .bracket.br{bottom:5px;right:5px;border-bottom:1.5px solid;border-right:1.5px solid;border-radius:0 0 var(--r-1) 0}
.win .head{
  flex:none;display:flex;align-items:center;gap:9px;height:34px;padding:0 6px 0 11px;cursor:grab;
  border-bottom:1px solid color-mix(in srgb,var(--border) 76%,transparent);
  background:linear-gradient(180deg,rgba(27,24,16,.66),transparent);
  user-select:none;
}
.win.dragging .head{cursor:grabbing}
.win .head .g{font-size:13px;opacity:.85;flex:none}
.win .head .t{
  font-family:var(--font-display);font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.win.focused .head .t{color:var(--text)}
.win .head .ref{
  font-size:10px;color:var(--accent);background:var(--accent-soft);
  border:1px solid var(--accent-line);border-radius:var(--r-pill);padding:1px 7px;flex:none;
  opacity:.8;transition:opacity var(--dur-fast),transform var(--dur-fast);
}
.win .head .ref:hover{opacity:1;transform:scale(1.06)}
.win .head .sp{flex:1}
.win .head .wb{
  width:22px;height:22px;border-radius:var(--r-2);display:grid;place-items:center;
  color:var(--text-faint);font-size:13px;line-height:1;flex:none;
  transition:background var(--dur-fast),color var(--dur-fast);
}
.win .head .wb:hover{background:var(--bg-raise-2);color:var(--text)}
.win .head .wb.x:hover{background:rgba(248,113,113,.16);color:var(--danger)}
.win .body{flex:1;overflow:auto;padding:13px 15px;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.win .grip{position:absolute;right:0;bottom:0;width:17px;height:17px;cursor:nwse-resize}
.win .grip::after{content:"";position:absolute;right:4px;bottom:4px;width:7px;height:7px;border-right:1.5px solid var(--border-strong);border-bottom:1.5px solid var(--border-strong)}
@keyframes materialize{
  from{opacity:0;transform:translate3d(var(--tx),var(--ty),0) scale(.86)}
  to{opacity:1;transform:translate3d(var(--tx),var(--ty),0) scale(1)}
}
.win.appearing{animation:materialize var(--dur-enter) var(--ease-spring)}
/* varredura de materialização */
.win.appearing::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:var(--r-4);
  background:linear-gradient(180deg,transparent 40%,color-mix(in srgb,var(--accent) 28%,transparent) 50%,transparent 60%);
  animation:sweep var(--dur-enter) var(--ease-standard);
}
@keyframes sweep{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
.win.closing{animation:vanish 160ms var(--ease-standard) forwards}
@keyframes vanish{to{opacity:0;transform:translate3d(var(--tx),var(--ty),0) scale(.93)}}
/* zona de encaixe */
#snap{
  position:absolute;z-index:9;border:1.5px dashed var(--accent);border-radius:var(--r-4);
  background:var(--accent-soft);opacity:0;transition:opacity var(--dur-fast);pointer-events:none;
}
#snap.on{opacity:1}

/* ── conteúdo das janelas ── */
.md h3{font-family:var(--font-display);font-size:18px;letter-spacing:.02em;margin-bottom:9px;color:var(--text)}
.md p{color:var(--text-dim);line-height:1.65;margin-bottom:11px;font-size:12.5px}
.md ul{margin:0 0 12px 17px;color:var(--text-dim);line-height:1.75;font-size:12.5px}
.md code{background:var(--bg-raise-2);padding:1px 5px;border-radius:var(--r-1);color:var(--accent);font-size:11.5px}
.md .rule{height:1px;background:var(--border);margin:14px 0}
.trace{font-size:11.5px;line-height:1.85}
.trace div{display:flex;gap:9px;white-space:pre-wrap}
.trace .ts{color:var(--text-faint);flex:none;font-size:10.5px;padding-top:1px}
.trace .ok{color:var(--ok)} .trace .wr{color:var(--warn)} .trace .dm{color:var(--text-dim)}
.trace .cur{display:inline-block;width:7px;height:13px;background:var(--accent);animation:blink 1s steps(2) infinite;vertical-align:-2px}
@keyframes blink{50%{opacity:0}}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:15px}
.metric{border:1px solid var(--border);border-radius:var(--r-3);padding:10px 12px;background:rgba(27,24,16,.4)}
.metric .k{font-family:var(--font-display);font-weight:600;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--text-faint)}
.metric .v{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
.metric.bad .v{color:var(--danger)} .metric.good .v{color:var(--ok)}
.bars{display:flex;align-items:flex-end;gap:5px;height:96px;padding:9px 0;border-bottom:1px solid var(--border)}
.bars i{flex:1;border-radius:2px 2px 0 0;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 24%,transparent));opacity:.82;transition:opacity var(--dur-fast),transform var(--dur-fast);transform-origin:bottom}
.bars i.f{background:linear-gradient(180deg,var(--danger),rgba(248,113,113,.2))}
.bars i:hover{opacity:1;transform:scaleX(1.25)}
.cap{font-size:10px;color:var(--text-faint);letter-spacing:.09em;text-transform:uppercase;font-family:var(--font-display);font-weight:600;margin:11px 0 7px}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid color-mix(in srgb,var(--border) 55%,transparent);font-size:12px}
.row .tag{font-size:9.5px;padding:2px 6px;border-radius:var(--r-1);letter-spacing:.07em;font-family:var(--font-display);font-weight:700}
.row .tag.f{background:rgba(248,113,113,.14);color:var(--danger)}
.row .tag.t{background:rgba(251,191,36,.14);color:var(--warn)}
.row .sp{flex:1}
.row .dim{color:var(--text-faint);font-size:11px}
#brainCv{display:block;width:100%;height:100%;cursor:crosshair}
.win[data-kind="app"] .body{padding:0;overflow:hidden}
.diagram{display:block;width:100%;height:auto}

/* ─────────────── console (âncora) ─────────────── */
#console{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dock-h) + 14px);
  width:min(880px,calc(100vw - var(--rail-w) - 56px));z-index:30;
  border:1px solid var(--border-strong);border-radius:var(--r-4);
  background:linear-gradient(180deg,rgba(27,24,16,.93),rgba(11,10,8,.93));
  backdrop-filter:blur(20px) saturate(1.1);
  box-shadow:0 30px 80px -30px rgba(0,0,0,.95),0 0 0 1px rgba(249,115,22,.07),0 0 60px -24px var(--accent-glow);
  transition:box-shadow var(--dur-base),transform var(--dur-slow) var(--ease-emphasized);
}
#console.busy{box-shadow:0 30px 80px -30px rgba(0,0,0,.95),0 0 0 1px var(--accent-line),0 0 80px -18px var(--accent-glow)}
/* bandeja de contexto: o que está aberto é referenciável */
#tray{display:flex;align-items:center;gap:7px;padding:8px 11px 0;flex-wrap:wrap;min-height:20px}
#tray .lbl{font-family:var(--font-display);font-weight:600;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);margin-right:2px}
.chip{
  display:flex;align-items:center;gap:6px;height:23px;padding:0 9px;border-radius:var(--r-pill);
  border:1px solid var(--border);background:rgba(27,24,16,.6);color:var(--text-dim);font-size:11px;
  transition:all var(--dur-fast) var(--ease-standard);
}
.chip .g{font-size:11px;opacity:.8}
.chip:hover{border-color:var(--accent-line);color:var(--text);background:var(--accent-soft);transform:translateY(-1px)}
.chip.used{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
#field-row{display:flex;align-items:flex-end;gap:10px;padding:9px 11px 11px}
#prompt{
  flex:1;background:transparent;border:0;outline:none;resize:none;color:var(--text);
  font-family:var(--font-mono);font-size:13.5px;line-height:1.55;max-height:132px;min-height:24px;padding:3px 0;
}
#prompt::placeholder{color:var(--text-faint)}
#send{
  display:flex;align-items:center;gap:7px;height:31px;padding:0 15px;border-radius:var(--r-3);flex:none;
  background:var(--accent);color:var(--accent-contrast);font-family:var(--font-display);font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;font-size:12px;
  transition:transform var(--dur-fast),filter var(--dur-fast);
}
#send:hover{transform:translateY(-1px);filter:brightness(1.08)}
#send:active{transform:translateY(0)}
#ac{
  position:absolute;left:11px;bottom:calc(100% + 7px);min-width:290px;z-index:2;
  border:1px solid var(--border-strong);border-radius:var(--r-3);overflow:hidden;
  background:rgba(19,17,9,.98);backdrop-filter:blur(18px);box-shadow:0 18px 44px -18px rgba(0,0,0,.9);
  display:none;
}
#ac.on{display:block;animation:pop var(--dur-base) var(--ease-emphasized)}
@keyframes pop{from{opacity:0;transform:translateY(7px)}}
#ac .h{font-family:var(--font-display);font-weight:600;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);padding:8px 11px 5px}
#ac button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 11px;text-align:left;font-size:12px;color:var(--text-dim)}
#ac button:hover,#ac button.sel{background:var(--accent-soft);color:var(--text)}
#ac button .r{margin-left:auto;color:var(--accent);font-size:10.5px}

/* ─────────────── dock ─────────────── */
#dock{
  position:fixed;left:0;right:0;bottom:0;height:var(--dock-h);z-index:42;
  display:flex;align-items:center;gap:14px;padding:0 14px;
  background:linear-gradient(0deg,rgba(11,10,8,.97),rgba(11,10,8,.6));
  border-top:1px solid color-mix(in srgb,var(--border) 70%,transparent);
  backdrop-filter:blur(14px);overflow:hidden;
  transition:height var(--dur-slow) var(--ease-emphasized),opacity var(--dur-slow);
}
body.dock-far #dock{height:16px;opacity:.62}
body.dock-far #dock>*{opacity:0;transition:opacity 120ms}
#dock .grp{display:flex;align-items:center;gap:4px;transition:opacity var(--dur-base)}
.space{
  display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:var(--r-3);
  color:var(--text-faint);font-family:var(--font-display);font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;font-size:12px;border:1px solid transparent;
  transition:all var(--dur-fast);
}

(() => {

const stage = document.getElementById("stage");
const tray = document.getElementById("tray");
const taskbar = document.getElementById("taskbar");
const promptEl = document.getElementById("prompt");
const ac = document.getElementById("ac");
const snapEl = document.getElementById("snap");

/* ── estado ─────────────────────────────────────────────────────────── */

const wins = new Map();            // id -> {el, ref, title, glyph, kind, min, rect}
const saved = new Map();           // espaço -> snapshot de janelas

const GLYPH = { artifact:"◈", run:"⎔", surface:"◉", app:"⬡", image:"▦" };

/* ── conteúdos de demonstração ──────────────────────────────────────── */
const CONTENT = {

      `<i style="height:${h}%" class="${[2,6,8,12].includes(i)?"f":""}"></i>`).join("")}</div>
    <div class="cap">Falhas recentes</div>
    <div class="row"><span class="tag f">FALHOU</span><span>Smoke test</span><span class="sp"></span><span class="dim">há 2 h</span></div>
    <div class="row"><span class="tag t">TIMEOUT</span><span>consolidate-memory</span><span class="sp"></span><span class="dim">há 13 h</span></div>
    <div class="row"><span class="tag f">FALHOU</span><span>nightly-consolidation · 3×</span><span class="sp"></span><span class="dim">há 13 h</span></div>

  "atencao": () => `

    <div class="row"><span class="tag f">FALHOU</span><span>Smoke test</span><span class="sp"></span><button class="chip" data-spawn="run">abrir trace</button></div>
    <div class="row"><span class="tag t">TIMEOUT</span><span>consolidate-memory</span><span class="sp"></span><button class="chip" data-spawn="run">abrir trace</button></div>
    <div class="row"><span class="tag f">FALHOU</span><span>nightly-consolidation · 3×</span><span class="sp"></span><button class="chip" data-spawn="run">abrir trace</button></div>`,
  "diagrama": () => `<svg class="diagram" viewBox="0 0 460 250" xmlns="http://www.w3.org/2000/svg">

        <rect x="166" y="16" width="128" height="48" rx="7"/>
        <rect x="316" y="16" width="128" height="48" rx="7"/>
        <rect x="92" y="104" width="128" height="48" rx="7" stroke="#f97316"/>
        <rect x="242" y="104" width="128" height="48" rx="7"/>
        <rect x="166" y="190" width="128" height="44" rx="7"/>
      </g>
      <g stroke="#8f8672" stroke-width="1" marker-end="url(#ar)" fill="none">
        <path d="M80 64 L 156 104"/><path d="M230 64 L 230 104"/><path d="M380 64 L 306 104"/>
        <path d="M156 152 L 214 190"/><path d="M306 152 L 246 190"/>

        <text x="80" y="45">FAIXA AMBIENTE</text><text x="230" y="45">TRILHO</text><text x="380" y="45">DOCK</text>
        <text x="156" y="133" fill="#f97316">PALCO</text><text x="306" y="133">JANELAS</text>
        <text x="230" y="217">CONSOLE · CONTEXTO</text>
      </g></svg>

      Uma imagem é uma janela como outra qualquer — e referenciável pelo console.</p>`,
};

const TRACE_LINES = [
  ["16:44:47","resolvendo contexto: @plano.md","dm"],
  ["16:44:48","lendo 3 arquivos do workspace","dm"],
  ["16:44:50","skill /agent-usage-report · modelo opus","dm"],
  ["16:44:52","ferramenta: grep(\"widget\", apps/) → 34 ocorrências","dm"],
  ["16:44:55","ferramenta: read(defaultLayout.ts)","dm"],
  ["16:44:58","9 widgets visíveis por padrão em grade 24×20","wr"],
  ["16:45:02","gerando artefato relatorio.md","dm"],
  ["16:45:06","concluído · 4 m 12 s · US$ 0,031","ok"],
];

/* ── criar janela ───────────────────────────────────────────────────── */
function openWindow(opt){
  if (wins.has(opt.id)) { focus(opt.id); return wins.get(opt.id); }
  const el = document.createElement("section");
  el.className = "win appearing";
  el.dataset.kind = opt.kind;
  const r = opt.rect || autoPlace(opt.w || 430, opt.h || 320);
  el.style.width = r.w + "px"; el.style.height = r.h + "px";
  el.style.setProperty("--tx", r.x + "px"); el.style.setProperty("--ty", r.y + "px");
  el.style.transform = `translate3d(${r.x}px,${r.y}px,0)`;
  el.innerHTML = `
    <i class="bracket tl"></i><i class="bracket br"></i>
    <header class="head">
      <span class="g">${GLYPH[opt.kind] || "◈"}</span>
      <span class="t">${opt.title}</span>
      <button class="ref" title="Inserir referência no console">@${opt.ref}</button>
      <span class="sp"></span>
      <button class="wb mn" title="Minimizar">—</button>
      <button class="wb mx" title="Maximizar">▢</button>
      <button class="wb x" title="Fechar">✕</button>
    </header>
    <div class="body">${opt.html}</div>
    <div class="grip"></div>`;
  stage.appendChild(el);
  const w = { el, id:opt.id, ref:opt.ref, title:opt.title, kind:opt.kind, rect:r, min:false, pre:null };
  wins.set(opt.id, w);
  wire(w);
  setTimeout(() => el.classList.remove("appearing"), 500);
  focus(opt.id); renderTray(); renderTasks();
  opt.after && opt.after(el.querySelector(".body"));
  return w;
}

/**
 * Procura o ponto menos coberto do palco em vez de empilhar no canto: varre
 * uma grade grossa, soma a área de sobreposição com cada janela viva e
 * desempata a favor do topo-esquerda. O console nunca entra na busca.
 */
function autoPlace(w, h){
  const W = stage.clientWidth, H = stage.clientHeight;
  const CONSOLE_BAND = 150;
  const ww = Math.min(w, W - 40), hh = Math.min(h, H - CONSOLE_BAND - 20);
  const live = [...wins.values()].filter(o => !o.min);
  let best = null;
  for (let gy = 14; gy + hh <= H - CONSOLE_BAND; gy += 40){
    for (let gx = 16; gx + ww <= W - 16; gx += 52){
      let cost = 0;
      for (const o of live){
        const ox = Math.max(0, Math.min(gx+ww, o.rect.x+o.rect.w) - Math.max(gx, o.rect.x));
        const oy = Math.max(0, Math.min(gy+hh, o.rect.y+o.rect.h) - Math.max(gy, o.rect.y));
        cost += ox * oy;
      }
      cost += (gx * 0.6 + gy) * 14;
      if (!best || cost < best.cost) best = { cost, x:gx, y:gy };
    }
  }
  if (!best) { const n = live.length; best = { x:Math.min(34+n*34, Math.max(16, W-ww-16)), y:Math.min(20+n*28, Math.max(12, H-hh-CONSOLE_BAND)) }; }
  return { x:best.x, y:best.y, w:ww, h:hh };
}

function place(w, r, animate){
  w.rect = r;
  const el = w.el;
  if (animate){ el.style.transition = "transform var(--dur-slow) var(--ease-emphasized), width var(--dur-slow) var(--ease-emphasized), height var(--dur-slow) var(--ease-emphasized), opacity var(--dur-base), filter var(--dur-base), border-color var(--dur-base), box-shadow var(--dur-base)"; }
  el.style.transform = `translate3d(${r.x}px,${r.y}px,0)`;
  el.style.width = r.w + "px"; el.style.height = r.h + "px";
  el.style.setProperty("--tx", r.x+"px"); el.style.setProperty("--ty", r.y+"px");
  if (animate) setTimeout(() => { el.style.transition = ""; }, 340);
}

function focus(id){
  focused = id;
  for (const [wid, w] of wins){
    const on = wid === id && !w.min;
    w.el.classList.toggle("focused", on);
    w.el.classList.toggle("unfocused", !on && !w.min);
  }
  const w = wins.get(id); if (w && !w.min) w.el.style.zIndex = ++z;
  renderTasks();
}

function closeWindow(id){
  const w = wins.get(id); if (!w) return;
  w.el.classList.add("closing");
  setTimeout(() => { w.el.remove(); wins.delete(id); renderTray(); renderTasks(); }, 170);
}

function minimize(id){
  const w = wins.get(id); if (!w) return;
  w.min = true;
  w.el.style.transition = "transform var(--dur-base) var(--ease-standard), opacity var(--dur-base)";
  w.el.style.transformOrigin = "bottom center";
  w.el.style.transform = `translate3d(${w.rect.x}px,${stage.clientHeight}px,0) scale(.4)`;
  w.el.style.opacity = "0";
  setTimeout(() => { w.el.style.visibility = "hidden"; w.el.style.transition=""; }, 210);
  renderTasks(); renderTray();
}
function restore(id){
  const w = wins.get(id); if (!w) return;
  w.min = false;
  w.el.style.visibility = "";
  w.el.style.transition = "transform var(--dur-slow) var(--ease-emphasized), opacity var(--dur-base)";
  requestAnimationFrame(() => { place(w, w.rect, false); w.el.style.opacity = "1"; });
  setTimeout(() => { w.el.style.transition = ""; }, 340);
  focus(id); renderTray();
}

function maximize(id){
  const w = wins.get(id); if (!w) return;
  if (w.pre){ place(w, w.pre, true); w.pre = null; }
  else {
    w.pre = { ...w.rect };
    place(w, { x:12, y:10, w:stage.clientWidth-24, h:stage.clientHeight-176 }, true);
  }
  focus(id);
}

/* ── arrastar / redimensionar / encaixar ────────────────────────────── */
function wire(w){
  const el = w.el, head = el.querySelector(".head"), grip = el.querySelector(".grip");
  el.addEventListener("pointerdown", () => { if (!overview) focus(w.id); }, true);
  el.querySelector(".x").onclick = e => { e.stopPropagation(); closeWindow(w.id); };
  el.querySelector(".mn").onclick = e => { e.stopPropagation(); minimize(w.id); };
  el.querySelector(".mx").onclick = e => { e.stopPropagation(); maximize(w.id); };
  el.querySelector(".ref").onclick = e => { e.stopPropagation(); insertRef(w.ref); };
  el.querySelectorAll("[data-spawn]").forEach(b => b.onclick = () => spawnRun());

  let raf = 0, pending = null, snapTo = null;
  head.addEventListener("pointerdown", ev => {
    if (ev.target.closest("button") || overview) return;
    ev.preventDefault();
    head.setPointerCapture(ev.pointerId);
    el.classList.add("dragging");
    getSelection()?.removeAllRanges();
    const sx = ev.clientX - w.rect.x, sy = ev.clientY - w.rect.y;
    const move = e => {
      const W = stage.clientWidth, H = stage.clientHeight;
      let x = e.clientX - sx, y = e.clientY - sy;
      x = Math.max(-w.rect.w + 90, Math.min(x, W - 90));
      y = Math.max(0, Math.min(y, H - 40));
      pending = { x, y };
      // pré-visualização de encaixe nas bordas
      const edge = e.clientX - stage.getBoundingClientRect().left;
      const half = { y:8, h:H - 172 };
      if (edge < 26)       snapTo = { x:8, w:(W-24)/2, ...half };
      else if (edge > W-26) snapTo = { x:W/2+4, w:(W-24)/2, ...half };
      else if (e.clientY - stage.getBoundingClientRect().top < 12) snapTo = { x:8, w:W-16, ...half };
      else snapTo = null;
      if (snapTo){ snapEl.classList.add("on"); Object.assign(snapEl.style,
        { left:snapTo.x+"px", top:snapTo.y+"px", width:snapTo.w+"px", height:snapTo.h+"px" }); }
      else snapEl.classList.remove("on");
      if (!raf) raf = requestAnimationFrame(() => {
        raf = 0; if (!pending) return;
        w.rect.x = pending.x; w.rect.y = pending.y;
        el.style.transform = `translate3d(${pending.x}px,${pending.y}px,0)`;
      });
    };
    const up = e => {
      head.releasePointerCapture(ev.pointerId);
      head.removeEventListener("pointermove", move); head.removeEventListener("pointerup", up);
      el.classList.remove("dragging"); snapEl.classList.remove("on");
      if (snapTo){ w.pre = null; place(w, snapTo, true); }
      else { el.style.setProperty("--tx", w.rect.x+"px"); el.style.setProperty("--ty", w.rect.y+"px"); }
      snapTo = null; pending = null;
    };
    head.addEventListener("pointermove", move); head.addEventListener("pointerup", up);
  });

  grip.addEventListener("pointerdown", ev => {
    if (overview) return;
    ev.preventDefault(); ev.stopPropagation();
    grip.setPointerCapture(ev.pointerId);
    const sw = w.rect.w, sh = w.rect.h, sx = ev.clientX, sy = ev.clientY;
    const move = e => {
      w.rect.w = Math.max(280, sw + (e.clientX - sx));
      w.rect.h = Math.max(150, sh + (e.clientY - sy));
      el.style.width = w.rect.w + "px"; el.style.height = w.rect.h + "px";
    };
    const up = () => { grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", up); };
    grip.addEventListener("pointermove", move); grip.addEventListener("pointerup", up);
  });
}

/* ── arranjos ───────────────────────────────────────────────────────── */
function tile(){
  const live = [...wins.values()].filter(w => !w.min);
  if (!live.length) return;
  const W = stage.clientWidth, H = stage.clientHeight - 150;
  const cols = live.length <= 2 ? live.length : Math.ceil(Math.sqrt(live.length));
  const rows = Math.ceil(live.length / cols);
  live.forEach((w, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    w.pre = null;
    place(w, { x: 10 + c*(W-20)/cols, y: 8 + r*H/rows, w:(W-20)/cols - 8, h:H/rows - 8 }, true);
  });
}
function cascade(){
  const live = [...wins.values()].filter(w => !w.min);
  const W = stage.clientWidth, H = stage.clientHeight;
  live.forEach((w, i) => {
    w.pre = null;
    place(w, { x: 40 + i*40, y: 20 + i*34, w: Math.min(560, W*.52), h: Math.min(380, H-200) }, true);
    w.el.style.zIndex = ++z;
  });
}
/* visão geral: a câmera afasta e mostra tudo. clicar volta para a janela. */
function toggleOverview(){
  overview = !overview;
  stage.classList.toggle("overview", overview);
  document.getElementById("btnOverview").setAttribute("aria-pressed", String(overview));
  const live = [...wins.values()].filter(w => !w.min);
  if (overview){
    const W = stage.clientWidth, H = stage.clientHeight;
    const cols = Math.min(3, Math.max(1, live.length));
    const rows = Math.ceil(live.length / cols);
    const cw = (W - 60) / cols, ch = (H - 150) / rows;
    live.forEach((w, i) => {
      w.ovPre = { ...w.rect };
      const c = i % cols, r = Math.floor(i / cols);
      const s = Math.min(cw / w.rect.w, ch / w.rect.h, .8);
      w.el.style.transition = "transform var(--dur-slow) var(--ease-emphasized)";
      w.el.style.transformOrigin = "top left";
      w.el.style.transform =
        `translate3d(${30 + c*cw + (cw - w.rect.w*s)/2}px,${14 + r*ch}px,0) scale(${s})`;
      w.el.classList.remove("unfocused");
      w.el.style.cursor = "zoom-in";
      w.el.onclick = () => { toggleOverview(); focus(w.id); };
    });
  } else {
    live.forEach(w => {
      w.el.style.transformOrigin = ""; w.el.style.cursor = ""; w.el.onclick = null;
      place(w, w.ovPre || w.rect, true);
    });
    setTimeout(() => focus(focused), 20);
  }
}

/* ── bandeja de contexto + referências ──────────────────────────────── */
function renderTray(){
  tray.querySelectorAll(".chip").forEach(c => c.remove());
  const live = [...wins.values()].filter(w => !w.min);
  tray.querySelector(".lbl").style.opacity = live.length ? ".9" : ".35";
  for (const w of live){
    const b = document.createElement("button");
    b.className = "chip";
    b.innerHTML = `<span class="g">${GLYPH[w.kind]}</span>@${w.ref}`;
    b.title = "Inserir no prompt";
    b.onclick = () => { insertRef(w.ref); b.classList.add("used"); setTimeout(()=>b.classList.remove("used"),700); };
    tray.appendChild(b);
  }
}
function insertRef(ref){
  const v = promptEl.value;
  promptEl.value = (v && !v.endsWith(" ") ? v + " " : v) + "@" + ref + " ";
  promptEl.focus(); autogrow();
}
function renderTasks(){
  taskbar.innerHTML = "";
  for (const w of wins.values()){
    const b = document.createElement("button");
    b.className = "task" + (w.min ? " min" : "");
    b.innerHTML = `${w.kind === "run" ? '<span class="live"></span>' : ""}<span class="g">${GLYPH[w.kind]}</span><span class="n">${w.title}</span>`;
    b.onclick = () => w.min ? restore(w.id) : (focused === w.id ? minimize(w.id) : focus(w.id));
    taskbar.appendChild(b);
  }
}

/* ── autocompletar @ ────────────────────────────────────────────────── */
let acItems = [], acSel = 0;
function updateAc(){
  const v = promptEl.value, m = /@([\w.\-]*)$/.exec(v.slice(0, promptEl.selectionStart));
  if (!m){ ac.classList.remove("on"); return; }
  const q = m[1].toLowerCase();
  acItems = [...wins.values()].filter(w => w.ref.toLowerCase().includes(q));
  if (!acItems.length){ ac.classList.remove("on"); return; }
  acSel = 0;
  ac.innerHTML = `<div class="h">Janelas abertas · referenciáveis</div>` + acItems.map((w,i)=>
    `<button data-i="${i}" class="${i===0?"sel":""}"><span>${GLYPH[w.kind]}</span>${w.title}<span class="r">@${w.ref}</span></button>`).join("");
  ac.querySelectorAll("button").forEach(b => b.onclick = () => pickAc(+b.dataset.i));
  ac.classList.add("on");
}
function pickAc(i){
  const w = acItems[i]; if (!w) return;
  promptEl.value = promptEl.value.replace(/@([\w.\-]*)$/, "@" + w.ref + " ");
  ac.classList.remove("on"); promptEl.focus(); autogrow();
}
function autogrow(){ promptEl.style.height = "auto"; promptEl.style.height = Math.min(promptEl.scrollHeight, 132) + "px"; }

promptEl.addEventListener("input", () => { autogrow(); updateAc(); });
promptEl.addEventListener("keydown", e => {
  if (ac.classList.contains("on")){
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      acSel = (acSel + (e.key === "ArrowDown" ? 1 : acItems.length - 1)) % acItems.length;
      ac.querySelectorAll("button").forEach((b,i)=>b.classList.toggle("sel", i===acSel));
      return;
    }
    if (e.key === "Enter" || e.key === "Tab"){ e.preventDefault(); pickAc(acSel); return; }
    if (e.key === "Escape"){ ac.classList.remove("on"); return; }
  }
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); submit(); }
});

/* ── executar: a resposta do agente ABRE UMA JANELA ─────────────────── */
function submit(){
  const text = promptEl.value.trim(); if (!text) return;
  promptEl.value = ""; autogrow(); ac.classList.remove("on");
  spawnRun(text);
}
let runN = 41;
function spawnRun(text){
  runN++;
  const id = "run:" + runN;
  document.body.dataset.core = "thinking";
  document.getElementById("console").classList.add("busy");
  const sig = document.getElementById("sig-runs");
  sig.dataset.level = "info"; sig.querySelector(".v").textContent = "1";

  const w = openWindow({
    id, kind:"run", ref:"run-"+runN, title:`run-${runN} · /agent-usage-report`,
    w:460, h:290, html:`<div class="trace" id="tr-${runN}"></div>`,
    after: body => {
      const box = body.querySelector(".trace");
      const lines = text
        ? [["agora", "prompt: " + text.slice(0,72) + (text.length>72?"…":""), "dm"], ...TRACE_LINES]
        : TRACE_LINES;
      let i = 0;
      const cur = document.createElement("span"); cur.className = "cur";
      const tick = () => {
        if (i >= lines.length){
          cur.remove();
          document.body.dataset.core = "idle";
          document.getElementById("console").classList.remove("busy");
          sig.dataset.level = "idle"; sig.querySelector(".v").textContent = "0";
          // o artefato produzido vira janela — é o ponto inteiro do redesenho
          openWindow({ id:"art:relatorio-"+runN, kind:"artifact", ref:"relatorio.md",
            title:"relatorio.md", w:430, h:300, html:CONTENT["plano.md"]() });
          renderTasks();
          return;
        }
        const [ts, msg, cls] = lines[i++];
        const d = document.createElement("div");
        d.innerHTML = `<span class="ts">${ts}</span><span class="${cls}">${msg}</span>`;
        box.insertBefore(d, cur); box.appendChild(cur);
        box.parentElement.scrollTop = box.parentElement.scrollHeight;
        setTimeout(tick, 300 + Math.random()*320);
      };
      box.appendChild(cur); setTimeout(tick, 260);
    }
  });
  return w;
}
document.getElementById("send").onclick = submit;

/* ── mini-canvas do Segundo Cérebro (janela de app) ─────────────────── */
function brainCanvas(body){
  const cv = document.createElement("canvas"); cv.id = "brainCv"; body.appendChild(cv);
  const ctx = cv.getContext("2d");
  const N = 46, nodes = [], edges = [];
  for (let i=0;i<N;i++) nodes.push({ a:Math.random()*Math.PI*2, r:.16+Math.random()*.82,
    s:(.12+Math.random()*.5)*(Math.random()<.5?-1:1), z:Math.random(), hue:Math.random()<.3?1:0 });
  for (let i=0;i<N;i++) for (let j=i+1;j<N;j++) if (Math.random()<.045) edges.push([i,j]);
  let raf, t0 = performance.now();
  const draw = now => {
    const dpr = Math.min(devicePixelRatio||1, 2);
    const W = body.clientWidth, H = body.clientHeight;
    if (!W || !H){ raf = requestAnimationFrame(draw); return; }
    if (cv.width !== W*dpr){ cv.width = W*dpr; cv.height = H*dpr; }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    const dt = (now - t0)/1000; t0 = now;
    const cx = W/2, cy = H/2, R = Math.min(W,H)*.42;
    const pts = nodes.map(n => { n.a += n.s*dt*.12;
      return { x: cx + Math.cos(n.a)*n.r*R*1.5, y: cy + Math.sin(n.a)*n.r*R*.82, n }; });
    ctx.lineWidth = 1;
    for (const [i,j] of edges){
      const a = pts[i], b = pts[j];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if (d > R*1.25) continue;
      ctx.strokeStyle = `rgba(122,109,74,${.36*(1-d/(R*1.25))})`;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    for (const p of pts){
      const s = 1.6 + p.n.z*2.4;
      ctx.fillStyle = p.n.hue ? "rgba(249,115,22,.9)" : "rgba(239,233,218,.62)";
      ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, 6.2832); ctx.fill();
    }
    raf = requestAnimationFrame(draw);
  };
  raf = requestAnimationFrame(draw);
  new ResizeObserver(() => {}).observe(body);
}

/* ── espaços (guardam o que estava aberto) ──────────────────────────── */
const SPACES = [
  { id:"trabalho", n:"Trabalho" },
  { id:"pesquisa", n:"Pesquisa" },
  { id:"ops", n:"Ops" },
];
let space = "trabalho";
const spacesEl = document.getElementById("spaces");
function renderSpaces(){
  spacesEl.innerHTML = "";
  for (const s of SPACES){
    const b = document.createElement("button");
    b.className = "space"; b.setAttribute("aria-pressed", String(s.id === space));
    const n = s.id === space ? wins.size : (saved.get(s.id)?.length ?? 0);
    b.innerHTML = `${s.n}${n ? `<span class="n">${n}</span>` : ""}`;
    b.onclick = () => switchSpace(s.id);
    spacesEl.appendChild(b);
  }
}
function switchSpace(id){
  if (id === space) return;
  saved.set(space, [...wins.values()].map(w => ({
    id:w.id, kind:w.kind, ref:w.ref, title:w.title, rect:{...w.rect}, html:w.el.querySelector(".body").innerHTML
  })));
  for (const w of wins.values()) w.el.remove();
  wins.clear();
  space = id;
  for (const s of (saved.get(id) ?? [])) openWindow({ ...s, rect:s.rect });
  renderTray(); renderTasks(); renderSpaces();
}
renderSpaces();
