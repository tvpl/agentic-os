name: CI

# Every pull request and every push to main is checked; the Actions tab can
# still run it by hand on any branch.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit + API tests
        if: runner.os != 'Windows'
        run: npm test
      - name: Unit tests (Windows — skips suites that need the bash fake CLIs)
        if: runner.os == 'Windows'
        run: npx vitest run --exclude tests/adapters.test.ts --exclude tests/api.test.ts --exclude tests/core.runs.test.ts --exclude tests/seeds.test.ts
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Packager smoke (bundle + launchers, system Node, no archive)
        if: runner.os != 'Windows'
        run: |
          npm run dist:quick
          stage=$(ls -d build/package/*/ | head -1)
          if [ -x "$stage/mordomo" ]; then cli="$stage/mordomo"; else cli="$stage/bin/mordomo"; fi
          export MORDOMO_HOME="$RUNNER_TEMP/pkg-home" MORDOMO_SKIP_NPM_AUDIT=1
          "$cli" status --json | grep -q '"running":false'
          "$cli" doctor | grep -q "Node.js version"

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore
