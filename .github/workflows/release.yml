name: Release

# Builds the packaged distributable for every platform and attaches the
# archives to a GitHub release. Manual only: nothing runs on push or tag;
# trigger it from the Actions tab and give it the tag to build.
#
# Optional secrets for macOS (without them the app is ad-hoc signed and users
# must right-click → Open once):
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD  — Developer ID Application certificate
#   MACOS_SIGN_IDENTITY                          — "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD  — notarytool credentials

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (defaults to the current ref)"
        required: false

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-arm64
          - os: macos-13
            label: macos-x64
          - os: ubuntu-22.04
            label: linux-x64
          - os: ubuntu-22.04-arm
            label: linux-arm64
          - os: windows-2022
            label: windows-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Import the Developer ID certificate (macOS, optional)
        if: runner.os == 'macOS' && env.CERT != ''
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p ci "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/build.keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$RUNNER_TEMP/build.keychain"
      - name: Store notarytool credentials (macOS, optional)
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: xcrun notarytool store-credentials mordomo --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"

      - name: Package (signed + notarized)
        if: runner.os == 'macOS' && env.IDENTITY != '' && env.APPLE_ID != ''
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: node scripts/package.mjs --skip-build --sign "$IDENTITY" --notarize mordomo
      - name: Package (signed)
        if: runner.os == 'macOS' && env.IDENTITY != '' && env.APPLE_ID == ''
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: node scripts/package.mjs --skip-build --sign "$IDENTITY"
      - name: Package
        if: runner.os != 'macOS' || env.IDENTITY == ''
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: node scripts/package.mjs --skip-build

      - name: Smoke-test the package (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          stage=$(ls -d build/package/*/ | head -1)
          if [ -x "$stage/mordomo" ]; then cli="$stage/mordomo"; else cli="$stage/bin/mordomo"; fi
          export MORDOMO_HOME="$RUNNER_TEMP/home" MORDOMO_SKIP_NPM_AUDIT=1
          mkdir -p "$MORDOMO_HOME/config"; echo '{"version":1,"port":4799}' > "$MORDOMO_HOME/config/settings.json"
          env -i HOME="$HOME" PATH=/usr/bin:/bin MORDOMO_HOME="$MORDOMO_HOME" "$cli" --help >/dev/null
          env -i HOME="$HOME" PATH=/usr/bin:/bin MORDOMO_HOME="$MORDOMO_HOME" "$cli" launch --no-browser
          curl -fsS -o /dev/null -w '%{content_type}\n' http://127.0.0.1:4799/ | grep -q text/html
          asset=$(grep -o '/assets/main-[^"]*\.js' "$stage"/*/Contents/Resources/ui/index.html "$stage"/ui/index.html 2>/dev/null | head -1 | sed 's/.*:\///')
          curl -fsS -o /dev/null -w '%{content_type}\n' "http://127.0.0.1:4799/$asset" | grep -q javascript
          env -i HOME="$HOME" PATH=/usr/bin:/bin MORDOMO_HOME="$MORDOMO_HOME" "$cli" stop
      - name: Smoke-test the package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = (Get-ChildItem build/package -Directory | Select-Object -First 1).FullName
          $env:MORDOMO_HOME = "$env:RUNNER_TEMP\home"; $env:MORDOMO_SKIP_NPM_AUDIT = "1"
          New-Item -ItemType Directory -Force "$env:MORDOMO_HOME\config" | Out-Null
          '{"version":1,"port":4799}' | Set-Content "$env:MORDOMO_HOME\config\settings.json"
          & "$stage\bin\mordomo.cmd" --help | Out-Null
          & "$stage\bin\mordomo.cmd" launch --no-browser
          $r = Invoke-WebRequest http://127.0.0.1:4799/ -UseBasicParsing
          if ($r.Headers["Content-Type"] -notmatch "text/html") { throw "index is not HTML" }
          & "$stage\bin\mordomo.cmd" stop

      - uses: actions/upload-artifact@v4
        with:
          name: mordomo-os-${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: package
    runs-on: ubuntu-latest
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          draft: true
